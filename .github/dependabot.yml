# GitHub Dependabot configuration for OutlookMcp
#
# Ecosystems below must match the manifests that actually exist in the repo. Adding an ecosystem
# with nothing to update is harmless but misleading; omitting one is not, because Dependabot alerts
# then flag a vulnerability that no update PR ever arrives to fix.
#
# Triage ownership: @trsdn reviews and merges every Dependabot PR. Security updates take priority
# and are merged as soon as CI is green. Grouped minor and patch updates are reviewed weekly. A
# Dependabot PR is merged only when the same required checks pass that any other PR must pass.

version: 2
updates:
  # NuGet dependencies - check weekly
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "trsdn"
    # Group minor and patch updates together
    groups:
      production-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # Only create PRs for security updates and major version updates immediately
    # Minor/patch updates are grouped
    ignore:
      # Ignore specific packages if needed
      # - dependency-name: "PackageName"
      #   versions: ["1.x", "2.x"]

  # GitHub Actions - check weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    reviewers:
      - "trsdn"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm - the VS Code extension. This is the only npm manifest with dependencies;
  # packages/outlook-cli-skill and packages/outlook-mcp-skill are publish-only manifests
  # with no dependencies to update.
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "trsdn"
    groups:
      npm-development:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

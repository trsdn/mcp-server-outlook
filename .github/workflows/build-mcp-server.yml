name: Build MCP Server

permissions:
  contents: read

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'src/OutlookMcp.McpServer/**'
      - 'src/OutlookMcp.Core/**'
      - 'src/OutlookMcp.ComInterop/**'
      - 'tests/OutlookMcp.McpServer.Tests/**'
      - 'tests/OutlookMcp.Core.Tests/**'
      - 'tests/OutlookMcp.Diagnostics.Tests/**'
      - 'tests/OutlookMcp.ComInterop.Tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/build-mcp-server.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/OutlookMcp.McpServer/**'
      - 'src/OutlookMcp.Core/**'
      - 'src/OutlookMcp.ComInterop/**'
      - 'tests/OutlookMcp.McpServer.Tests/**'
      - 'tests/OutlookMcp.Core.Tests/**'
      - 'tests/OutlookMcp.Diagnostics.Tests/**'
      - 'tests/OutlookMcp.ComInterop.Tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/build-mcp-server.yml'

jobs:
  build-mcp-server:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore src/OutlookMcp.McpServer/OutlookMcp.McpServer.csproj

    - name: Build MCP Server
      run: dotnet build src/OutlookMcp.McpServer/OutlookMcp.McpServer.csproj --no-restore --configuration Release

    - name: Verify Core Commands Coverage
      run: |
        Write-Output "Verifying Core Commands coverage..."
        # audit-core-coverage.ps1 (regex-scraping a hand-authored ToolActions.cs) predates the
        # move to Roslyn source generators (#5/#11) -- actions are now generated directly from
        # [ServiceAction] attributes on Core interfaces, so ToolActions.cs no longer exists and
        # the script silently reported "0/0 = 100% coverage", a false-green gate (#25). Replaced
        # with the reflection-based CoreCommandsCoverageTests, which enumerates the live Outlook
        # Core interfaces/enums and genuinely fails if any method lacks an enum value.
        dotnet test tests/OutlookMcp.McpServer.Tests --filter "FullyQualifiedName~CoreCommandsCoverageTests" --configuration Release
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Coverage gaps detected! All Core methods must be exposed via MCP Server."
          exit 1
        }
        Write-Output "Coverage audit passed - all Core methods have matching enum actions"
      shell: pwsh

    - name: Verify MCP Server build
      run: |
        # Check MCP Server executable
        if (Test-Path "src/OutlookMcp.McpServer/bin/Release/net9.0-windows/OutlookMcp.McpServer.exe") {
          Write-Output "✅ OutlookMcp.McpServer.exe built successfully"
          $mcpVersion = (Get-Item "src/OutlookMcp.McpServer/bin/Release/net9.0-windows/OutlookMcp.McpServer.exe").VersionInfo.FileVersion
          Write-Output "📦 MCP Server Version: $mcpVersion"

          # Check for MCP server.json configuration
          if (Test-Path "src/OutlookMcp.McpServer/bin/Release/net9.0-windows/.mcp/server.json") {
            Write-Output "✅ MCP server.json configuration found"
          } else {
            Write-Warning "⚠️ MCP server.json configuration not found"
          }
        } else {
          Write-Error "❌ OutlookMcp.McpServer.exe not found"
          exit 1
        }

        Write-Output "🧠 MCP Server ready for AI assistant integration"
      shell: pwsh

    - name: Upload MCP Server build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: OutlookMcp-MCP-Server-${{ github.sha }}
        path: src/OutlookMcp.McpServer/bin/Release/net9.0-windows/

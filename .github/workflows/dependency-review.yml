# Dependency Review Workflow
# Scans pull requests for vulnerable dependencies before merging

name: 'Dependency Review'

on: 
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # Fail the build if vulnerabilities are found
          fail-on-severity: moderate
          
          # Fail if GPL/AGPL/LGPL licenses detected (stricter than MIT)
          license-check: true
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, LicenseRef-scancode-generic-cla, BlueOak-1.0.0, CC0-1.0
          
          # Comment on PR with summary
          comment-summary-in-pr: always
          
          # Show vulnerabilities by severity
          warn-only: false
          
          # Block critical and high severity vulnerabilities
          fail-on-scopes: runtime, development
          
          # Additional configuration
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

          # Known unfixable transitive vulnerabilities in dev-only build tools
          # minimatch@3.x ReDoS in @vscode/vsce (no fix available upstream)
          allow-ghsas: GHSA-3ppc-4f35-3m26

          # The Office interop assemblies carry no machine-readable license and
          # StreamJsonRpc declares the compound expression
          # "Apache-2.0 AND MIT AND MS-PL". Both are load-bearing for a Windows
          # COM automation server and cannot be swapped out.
          #
          # Xunit.SkippableFact is MS-PL (the same OSI-approved permissive
          # license already accepted transitively via StreamJsonRpc). It is a
          # test-only dependency that is never redistributed, and it is what
          # lets the Outlook integration tests skip loudly instead of passing
          # silently when classic Outlook is unavailable (#22).
          allow-dependencies-licenses: >-
            pkg:nuget/Microsoft.Office.Interop.Outlook,
            pkg:nuget/StreamJsonRpc,
            pkg:nuget/Xunit.SkippableFact
          
      - name: Dependency Review Summary
        if: always()
        run: |
          echo "✅ Dependency review completed"
          echo "Review results are available in the Security tab"

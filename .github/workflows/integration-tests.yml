name: Outlook Integration Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/integration-tests.yml'
  push:
    branches: [ master, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:
jobs:
  integration-runner-disabled:
    if: ${{ vars.ENABLE_OUTLOOK_INTEGRATION_CI != 'true' }}
    runs-on: windows-latest
    steps:
      - name: Report disabled Outlook runner
        shell: pwsh
        run: |
          Write-Output "Outlook integration workflow is configured but inactive."
          Write-Output "Set repository variable ENABLE_OUTLOOK_INTEGRATION_CI=true and provide a self-hosted Windows runner labeled 'outlook' with classic Outlook installed. See issue #31."
          Write-Output "See docs/AZURE_SELFHOSTED_RUNNER_SETUP.md for setup details."

  outlook-integration:
    if: ${{ vars.ENABLE_OUTLOOK_INTEGRATION_CI == 'true' }}
    runs-on: [self-hosted, windows, outlook]

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build CLI and MCP Server
        shell: pwsh
        run: |
          dotnet build src/OutlookMcp.CLI/OutlookMcp.CLI.csproj -c Release
          dotnet build src/OutlookMcp.McpServer/OutlookMcp.McpServer.csproj -c Release

      - name: Run CLI smoke workflow
        shell: pwsh
        run: ./scripts/Test-CliWorkflow.ps1

      - name: Run MCP smoke workflow
        shell: pwsh
        run: >
          dotnet test tests/OutlookMcp.McpServer.Tests/OutlookMcp.McpServer.Tests.csproj
          --filter "FullyQualifiedName~McpServerIntegrationTests.SmokeTest_AllTools_E2EWorkflow"
          --logger "trx;LogFileName=mcp-smoke.trx"

      - name: Run fast Core integration suite
        shell: pwsh
        run: >
          dotnet test tests/OutlookMcp.Core.Tests/OutlookMcp.Core.Tests.csproj
          --filter "Category=Integration&RunType!=OnDemand"
          --logger "trx;LogFileName=core-integration.trx"

      - name: Verify Outlook tests were not all skipped
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter "core-integration.trx" | Select-Object -First 1 -ExpandProperty FullName
          ./scripts/check-outlook-tests-not-all-skipped.ps1 -TrxPath $trx

      - name: Run CLI integration suite
        shell: pwsh
        run: >
          dotnet test tests/OutlookMcp.CLI.Tests/OutlookMcp.CLI.Tests.csproj
          --logger "trx;LogFileName=cli-integration.trx"

      - name: Run MCP integration suite
        shell: pwsh
        run: >
          dotnet test tests/OutlookMcp.McpServer.Tests/OutlookMcp.McpServer.Tests.csproj
          --logger "trx;LogFileName=mcp-integration.trx"

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: outlook-integration-${{ github.run_id }}
          path: |
            **/*.trx
